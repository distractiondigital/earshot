[package]
name = "earshot-worker"
description = "Earshot inference sidecar (VAD, transcription, diarization, summaries)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# GPU backends for whisper.cpp. CUDA needs the CUDA Toolkit at build time; Metal is macOS-only.
cuda = ["whisper-rs/cuda"]
metal = ["whisper-rs/metal"]

[dependencies]
earshot-protocol = { path = "../earshot-protocol" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
whisper-rs = { version = "=0.16.0", features = ["log_backend"] }
symphonia = { version = "=0.6.1", default-features = false, features = ["flac"] }
rubato = { version = "=5.1.0", default-features = false, features = ["fft_resampler"] }
audioadapter-buffers = "=5.2.0"
