[package]
name = "earshot"
description = "Local meeting recorder and transcriber"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "earshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = ["tray-icon", "image-png"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
rusqlite_migration = "=2.9.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
