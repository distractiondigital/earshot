[package]
name = "earshot"
description = "Local meeting recorder and transcriber"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "earshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
rusqlite_migration = "=2.9.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
# Audio capture and storage
cpal = "=0.18.2"
rtrb = "=0.4.1"
flacenc = { version = "=0.5.1", default-features = false }
# Audio export: decoding the tracks, matching sample rates, MP3 (LAME)
symphonia = { version = "=0.6.1", default-features = false, features = ["flac"] }
rubato = { version = "=5.1.0", default-features = false, features = ["fft_resampler"] }
audioadapter-buffers = "=5.2.0"
mp3lame-encoder = "=0.3.0"
# Model manager and transcription jobs
earshot-protocol = { path = "../crates/earshot-protocol" }
reqwest = { version = "=0.13.5", default-features = false, features = ["stream", "rustls", "http2"] }
futures-util = "=0.3.34"
tokio = { version = "=1.54.1", features = ["fs", "io-util", "sync", "time"] }
sha2 = "=0.11.1"
sysinfo = { version = "=0.40.4", default-features = false, features = ["system"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.14.1"
tauri-plugin-process = "=2.4.0"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-log = "=2.10.2"

[target.'cfg(windows)'.dependencies]
wasapi = "=0.27.0"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# NVIDIA GPU / VRAM detection (loads the driver's NVML library at runtime; absent = no NVIDIA GPU).
nvml-wrapper = "=0.13.0"
