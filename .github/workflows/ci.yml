name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # rustup reads the pinned toolchain from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Third-party licenses are up to date
        if: runner.os == 'Windows'
        run: node scripts/licenses.mjs --check

      - name: Typecheck and build frontend
        run: npm run build

      - name: Build worker sidecar
        run: npm run build:worker

      - name: Rust format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      # Updater artifacts need the signing key; only the release workflow produces them.
      - name: Build app bundle
        shell: bash
        run: npx tauri build --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v7
        with:
          name: earshot-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
