[workspace]
resolver = "3"
members = ["src-tauri", "crates/earshot-protocol", "crates/earshot-worker", "crates/earshot-llm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.100"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
log = "=0.4.35"

[profile.release]
codegen-units = 1
lto = true
strip = true

# whisper.cpp (C++, built by whisper-rs-sys via CMake) and audio decoding are unusably slow
# unoptimized; optimize them even in dev builds. The worker itself too: generic code such as the
# resampler is compiled into the calling crate, so overriding its library alone doesn't help.
[profile.dev.package.earshot-worker]
opt-level = 3
[profile.dev.package.whisper-rs-sys]
opt-level = 3
[profile.dev.package.whisper-rs]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.audioadapter]
opt-level = 3
[profile.dev.package.audioadapter-buffers]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.num-complex]
opt-level = 3
[profile.dev.package.transpose]
opt-level = 3
[profile.dev.package.strength_reduce]
opt-level = 3
[profile.dev.package.primal-check]
opt-level = 3
[profile.dev.package.earshot-llm]
opt-level = 3
[profile.dev.package.llama-cpp-2]
opt-level = 3
