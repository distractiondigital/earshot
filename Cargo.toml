[workspace]
resolver = "3"
members = ["src-tauri", "crates/earshot-worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.100"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
log = "=0.4.35"

[profile.release]
codegen-units = 1
lto = true
strip = true
